name: Release Obsidian Plugin

# Obsidian Community Plugin convention: tag matches manifest.json version without a leading "v" (e.g. 0.1.0)
on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Verify tag matches manifest version
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER=$(node -p "require('./manifest.json').version")
          PKG_VER=$(node -p "require('./packages/obsidian-ulysses-feel/manifest.json').version")
          if [ "$TAG" != "$VER" ] || [ "$TAG" != "$PKG_VER" ]; then
            echo "Tag ($TAG) does not match manifest.json ($VER / $PKG_VER)"
            exit 1
          fi
      - name: Create GitHub Release with Obsidian plugin artifacts
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            packages/obsidian-ulysses-feel/main.js
            packages/obsidian-ulysses-feel/manifest.json
            packages/obsidian-ulysses-feel/styles.css
